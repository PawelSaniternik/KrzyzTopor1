version: '3.8'

services:
  # Usługa bazy danych MariaDB
  database:
    image: mariadb:11
    container_name: krzyztopor_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 6=Pgb|^*r9Z1^Y!w|B2o
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  # Usługa aplikacji Symfony API (KrzyzTopor1)
  api:
    build:
      context: ./KrzyzTopor1
      dockerfile: Dockerfile
    container_name: krzyztopor_api
    restart: unless-stopped
    volumes:
      - ./KrzyzTopor1:/var/www/html:rw
    environment:
      APP_ENV: dev
      APP_SECRET: 3f52a781d4a234f9a5e885141cd2a43b
      # DSN skrojony pod MariaDB (wskazuje na usługę 'database' i port 3306)
      DATABASE_URL: "mysql://app_user:app_password@database:3306/app_db?serverVersion=mariadb-10.11.2&charset=utf8mb4"
    depends_on:
      - database
    networks:
      - app_network

  # Serwer WWW Nginx wystawiający API na zewnątrz
  web:
    image: nginx:alpine
    container_name: krzyztopor_web
    ports:
      - "8080:80"
    volumes:
      - ./KrzyzTopor1/public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge